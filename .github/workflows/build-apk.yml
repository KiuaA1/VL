name: Build VL APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-36" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Clone native modules if missing
        run: |
          if [ ! -d glfw/jni_bindings ]; then
            git clone --depth 1 https://github.com/MojoLauncher/glfw.git glfw
          fi
          if [ ! -d sdl/jni_bindings ]; then
            git clone --depth 1 https://github.com/MojoLauncher/MojoSDL.git sdl
          fi
          if [ ! -d mojoexec/jni_bindings ]; then
            git clone --depth 1 https://github.com/MojoLauncher/mojoexec.git mojoexec
          fi

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app_pojavlauncher:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VL-debug-apk
          path: app_pojavlauncher/build/outputs/apk/**/*.apk
          if-no-files-found: warn
