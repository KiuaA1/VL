name: Build VL APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK env
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH

      - name: Accept licenses and install packages
        run: |
          set -e
          SDKROOT=/usr/local/lib/android/sdk
          SM=$(find "$SDKROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -z "$SM" ]; then
            mkdir -p "$SDKROOT/cmdline-tools"
            curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
            rm -rf "$SDKROOT/cmdline-tools/latest"
            mv /tmp/cmdtools/cmdline-tools "$SDKROOT/cmdline-tools/latest"
            SM="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SM" --sdk_root="$SDKROOT" --licenses || true
          "$SM" --sdk_root="$SDKROOT" "platforms;android-36" "build-tools;35.0.0" "platform-tools" "ndk;27.0.12077973" "cmake;3.22.1"
          echo "sdk.dir=$SDKROOT" > local.properties

      - name: Ensure native modules
        run: |
          if [ ! -d glfw/jni_bindings ]; then git clone --depth 1 https://github.com/MojoLauncher/glfw.git glfw; fi
          if [ ! -d sdl/jni_bindings ]; then git clone --depth 1 https://github.com/MojoLauncher/MojoSDL.git sdl; fi
          if [ ! -d mojoexec/jni_bindings ]; then git clone --depth 1 https://github.com/MojoLauncher/mojoexec.git mojoexec; fi
          find . -name build.gradle -print0 | xargs -0 sed -i 's/ndkVersion "29.0.14206865"/ndkVersion "27.0.12077973"/g' || true

      - name: Patch version name
        run: |
          sed -i 's/return "justicia-/return "VL-/g' app_pojavlauncher/build.gradle || true
          sed -i 's/return "LOCAL-/return "VL-/g' app_pojavlauncher/build.gradle || true

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app_pojavlauncher:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VL-debug-apk
          path: app_pojavlauncher/build/outputs/apk/**/*.apk
          if-no-files-found: error
