name: Build VL APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK env
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH

      - name: Accept licenses and install packages
        run: |
          set -e
          SDKROOT=/usr/local/lib/android/sdk
          SM=$(find "$SDKROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -z "$SM" ]; then
            mkdir -p "$SDKROOT/cmdline-tools"
            curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
            rm -rf "$SDKROOT/cmdline-tools/latest"
            mv /tmp/cmdtools/cmdline-tools "$SDKROOT/cmdline-tools/latest"
            SM="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SM" --sdk_root="$SDKROOT" --licenses || true
          "$SM" --sdk_root="$SDKROOT" "platforms;android-36" "build-tools;35.0.0" "platform-tools" "ndk;27.0.12077973" "cmake;3.22.1"
          echo "sdk.dir=$SDKROOT" > local.properties

      - name: Setup native modules and jni symlinks
        run: |
          set -e
          # Full native trees required by CMakeLists under jni/
          rm -rf glfw && git clone --depth 1 https://github.com/MojoLauncher/glfw.git glfw
          rm -rf mojoexec && git clone --depth 1 https://github.com/MojoLauncher/mojoexec.git mojoexec
          rm -rf sdl && git clone --depth 1 https://github.com/MojoLauncher/MojoSDL.git sdl
          find . -name build.gradle -print0 | xargs -0 sed -i 's/ndkVersion "29.0.14206865"/ndkVersion "27.0.12077973"/g' || true
          # Symlinks expected by app_pojavlauncher/src/main/jni/CMakeLists.txt
          JNI=app_pojavlauncher/src/main/jni
          rm -rf "$JNI/glfw" "$JNI/sdl" "$JNI/mojoexec"
          ln -s ../../../../glfw "$JNI/glfw"
          ln -s ../../../../sdl "$JNI/sdl"
          ln -s ../../../../mojoexec "$JNI/mojoexec"
          ls -la "$JNI"

      - name: Patch version name
        run: |
          sed -i 's/return "justicia-/return "VL-/g' app_pojavlauncher/build.gradle || true
          sed -i 's/return "LOCAL-/return "VL-/g' app_pojavlauncher/build.gradle || true

      - name: Force C11 stdbool for native build
        run: |
          # Mojo C sources use bool without always including stdbool.h
          CMAKE="$PWD/app_pojavlauncher/src/main/jni/CMakeLists.txt"
          if ! grep -q 'CMAKE_C_STANDARD' "$CMAKE"; then
            sed -i '1a set(CMAKE_C_STANDARD 11)\nset(CMAKE_C_STANDARD_REQUIRED ON)\nadd_compile_options($<$<COMPILE_LANGUAGE:C>:-include> $<$<COMPILE_LANGUAGE:C>:stdbool.h>)' "$CMAKE"
          fi
          head -15 "$CMAKE"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app_pojavlauncher:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VL-debug-apk
          path: app_pojavlauncher/build/outputs/apk/**/*.apk
          if-no-files-found: error
